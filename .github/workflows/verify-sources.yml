name: Verify sources

# Maintainer workflow: fetch every publisher website, feed and e-paper link from
# a machine with normal internet access, print the result and keep the JSON
# report as an artifact. It never edits the registry — promoting a feed to
# `verified_working` is a reviewed commit based on this evidence.
on:
  # Also runs whenever the registry, the candidate list or a verifier changes,
  # so a data commit always carries live evidence.
  push:
    branches: ["main", "arena/**", "feature/**"]
    paths:
      - "assets/data/sources.json"
      - "assets/data/feed_candidates.json"
      - "scripts/verify_sources.py"
      - "scripts/probe_feeds.py"
      - ".github/workflows/verify-sources.yml"
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe curated candidate feed URLs instead of the registry"
        required: false
        default: "false"
      only:
        description: "Comma separated source ids (empty = every source)"
        required: false
        default: ""
      delay:
        description: "Seconds between requests (be polite)"
        required: false
        default: "1.0"
  schedule:
    # Weekly, Monday 03:00 UTC.
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  verify:
    name: Check live feeds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stress the verifier
        run: |
          python3 -m py_compile scripts/verify_sources.py
          python3 scripts/verify_sources.py --help >/dev/null

      - name: Probe curated candidates
        env:
          ONLY: ${{ inputs.only }}
          DELAY: ${{ inputs.delay }}
        run: |
          set -o pipefail
          python3 scripts/probe_feeds.py \
            --only "${ONLY}" \
            --delay "${DELAY:-0.8}" \
            --report feed_probe.json 2>&1 | tee probe.log

      - name: Verify publishers
        env:
          ONLY: ${{ inputs.only }}
          DELAY: ${{ inputs.delay }}
        run: |
          set -o pipefail
          python3 scripts/verify_sources.py \
            --only "${ONLY}" \
            --delay "${DELAY:-1.0}" \
            --report source_verification.json 2>&1 | tee verify.log

      # The run log is not always reachable from tooling, so the per-source
      # verdicts are republished as one annotation block.
      - name: Publish verdicts
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def emit(title: str, lines: list[str], limit: int = 140) -> None:
              body = lines[:limit]
              if not body:
                  return
              for start in range(0, len(body), 12):
                  chunk = body[start:start + 12]
                  message = '%0A'.join(item.replace('%', '%25') for item in chunk)
                  print(f'::notice::{title}%0A{message[:60000]}')

          probe = Path('probe.log')
          if probe.exists():
              lines = probe.read_text(encoding='utf-8', errors='replace').splitlines()
              picked = [line for line in lines
                        if line.startswith(('  OK', '  x ', '      ', '  =>', '  + '))
                        or line.startswith('selected')]
              emit('Curated feed probe', picked)

          verify_log = Path('verify.log')
          if verify_log.exists():
              lines = verify_log.read_text(encoding='utf-8', errors='replace').splitlines()
              picked = [line for line in lines
                        if line.startswith(('  + ', '  x ', '  ! ', '  ? ')) or line.startswith('summary:')]
              emit('Registry verification', picked)
          PY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-verification
          path: |
            source_verification.json
            feed_probe.json
            verify.log
            probe.log
          if-no-files-found: warn
