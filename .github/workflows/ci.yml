name: CI

on:
  push:
    branches: ["main", "arena/**", "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Formatting is applied locally with `dart format lib test`; CI gates on
      # analysis and tests so a purely cosmetic diff cannot block a release.
      - name: Static analysis
        run: |
          set -o pipefail
          flutter analyze --fatal-warnings 2>&1 | tee analyze.log

      # Runner logs are not always reachable from a headless session, so the
      # diagnostics are republished as check annotations (and kept as an
      # artifact). The analysis step above still decides pass/fail.
      - name: Surface analyzer diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path

          entries = [line for line in Path('analyze.log').read_text(
              encoding='utf-8', errors='replace').splitlines() if line.strip()]
          for start in range(0, min(len(entries), 240), 12):
              chunk = entries[start:start + 12]
              message = '%0A'.join(item.replace('%', '%25') for item in chunk)
              print(f'::error::{message}')
          PY

      - name: Upload analyzer output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: analyze.log
          if-no-files-found: ignore

      - name: Unit and widget tests
        run: |
          set -o pipefail
          flutter test --reporter expanded --coverage 2>&1 | tee test.log

      - name: Surface test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path('test.log').read_text(encoding='utf-8', errors='replace')
          lines = text.splitlines()
          interesting = [
              line for line in lines
              if any(marker in line for marker in (
                  'Error:', 'error:', 'Failure', 'FAILED', 'Expected:', 'Actual:',
                  'Which:', 'test/unit/', 'test/widget/', 'Some tests failed',
                  'compilation failed', 'Error: ',
              ))
          ] or lines[-120:]
          for start in range(0, min(len(interesting), 240), 12):
              chunk = interesting[start:start + 12]
              message = '%0A'.join(item.replace('%', '%25') for item in chunk)
              print(f'::error::{message}')
          PY

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          if-no-files-found: ignore

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK (unsigned/debug-signed fallback)
        run: flutter build apk --release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
