name: bangladesh_newspaper_hub
description: >-
  Bangladesh Newspaper Hub — a premium, offline-friendly Android news reader and
  verified directory of Bangladeshi newspapers, portals and e-paper editions.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (lightweight, no code generation).
  provider: ^6.1.2

  # Networking + XML/RSS parsing.
  http: ^1.2.2
  xml: ^6.5.0
  html: ^0.15.4

  # Local persistence: structured cache (sqlite) + small preferences.
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Platform integration.
  url_launcher: ^6.3.0
  share_plus: ^7.2.2
  connectivity_plus: ^6.0.3

  # Media + formatting.
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/sources.json
    - assets/data/source_candidates.json
    - assets/fonts/OFL.txt

  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
    - family: NotoSerifBengali
      fonts:
        - asset: assets/fonts/NotoSerifBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerifBengali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSerifBengali-Bold.ttf
          weight: 700
